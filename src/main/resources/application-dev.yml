spring:
  devtools:
    restart:
      enabled: true

  datasource:
    url: jdbc:mysql://localhost/otp?useUnicode=true&characterEncoding=utf8&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    name: MySQL Local Connection
    username: root
    password: rahulvj17
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      data-source-properties:
        cachePrepStmts: true
        prepStmtCacheSize: 250
        prepStmtCacheSqlLimit: 2048
        useServerPrepStmts: true
  
  sql:
    init:
      mode: always
      continue-on-error: false
      data-locations: classpath:db/init/schema.sql

  jpa:
    defer-datasource-initialization: true
    hibernate:
      ddl-auto: update
    database-platform: org.hibernate.dialect.MySQL8Dialect
    database: MYSQL
    show_sql: false
    open-in-view: false
    factory-class: org.springframework.data.envers.repository.support.EnversRevisionRepositoryFactoryBean
    properties:
      hibernate.cache.use_second_level_cache: false
      hibernate.cache.use_query_cache: false
      hibernate.generate_statistics: true

  data:
    redis:
      host: localhost
      port: 6379

  mail:
    host: smtp.gmail.com
    port: 587
    username: frederickraghul@gmail.com
    password: hnmnayxuemamvgnl
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true

otp:
  expiry-minutes: 5
  max-attempts: 3
  attempt-window-minutes: 10

  audit-purge:
    enabled: true
    retention-days: 30

jwt:
  header: Authorization
  secret: c3Ryb25nLXNwcmluZy1ib290LXNlY3JldC1rZXktMTIzNDU2Nzg5MA==
  expiration: 300

server:
  port: 8080
  shutdown: graceful
  lifecycle:
    timeout-per-shutdown-phase: 30s

# Actuator/Monitoring Configuration
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,env,configprops,beans,mappings,threaddump,heapdump,shutdown
      base-path: /actuator
  endpoint:
    health:
      show-details: always
    info:
      enabled: true
    build:
      enabled: false
    metrics:
      enabled: true
    shutdown:
      enabled: false

# Custom Info Endpoint Configuration
info:
  app:
    name: Spring Boot OTP Authentication
    description: Secure One-Time Password (OTP) authentication system with JWT tokens
    version: 1.0.0
    java-version: 17
    spring-boot-version: 3.2.3
  system:
    os: Windows
    architecture: x64
  contact:
    name: Spring Boot OTP Team
    email: frederickraghul@springboot.com
  license:
    name: MIT License
    url: https://opensource.org/licenses/MIT

# Swagger/OpenAPI Configuration
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method
    tagsSorter: alpha

debug: true

logging:
  level:
    org.springframework.security.authentication.dao.DaoAuthenticationProvider: warn
    org.springframework.security.authentication.ProviderManager: warn
