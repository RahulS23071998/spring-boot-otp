spring:
  application:
    name: spring-boot-otp-test
  datasource:
    url: jdbc:h2:mem:testdb;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        globally_quoted_identifiers: true
        dialect: org.hibernate.dialect.H2Dialect
  h2:
    console:
      enabled: false
  liquibase:
    enabled: false
  mail:
    host: localhost
    port: 1025
    username: test
    password: test
    properties:
      mail:
        smtp:
          auth: false
          starttls:
            enable: false

app:
  mail:
    from: test@example.com
  provider:
    host: localhost
    port: 1025

logging:
  level:
    root: WARN
    org.springframework: WARN
    com.starter.springboot: WARN
    org.hibernate: WARN