spring:
  application:
    name: Starter Project
  profiles:
    active: dev
  jpa:
    properties:
      hibernate:
        generate_statistics: false

logging:
  level:
    org.springframework.security.authentication.dao.DaoAuthenticationProvider: warn
    org.springframework.security.authentication.ProviderManager: warn
    org.springframework.web.servlet.mvc.method.annotation.ExceptionHandlerExceptionResolver: info
    org.hibernate.engine.internal.StatisticalLoggingSessionEventListener: off
    org.springframework.boot.autoconfigure.logging.ConditionEvaluationReportLogger: off
    org.hibernate.stat: off
    org.hibernate: warn

otp:
  audit-purge:
    enabled: true
    retention-days: 90

management:
  endpoints:
    web:
      exposure:
        include: "*"

# Custom Info Endpoint Configuration
info:
  app:
    name: Spring Boot OTP Authentication
    description: Secure One-Time Password (OTP) authentication system with JWT tokens
    version: 1.0.0
    java-version: 17
    spring-boot-version: 3.2.3
  system:
    os: Windows
    architecture: x64
  contact:
    name: Spring Boot OTP Team
    email: frederickraghul@springboot.com
  license:
    name: MIT License
    url: https://opensource.org/licenses/MIT
